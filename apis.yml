aid: tensor9
name: Tensor9
description: >-
  Tensor9 is an enterprise BYOC (bring-your-own-cloud) / any-prem software
  deployment platform that lets software and AI vendors deploy their existing
  cloud-native stack into customer-owned environments — other public clouds,
  private VPCs, Kubernetes, or on-prem data centers — without rearchitecting.
  It compiles a vendor's existing infrastructure-as-code (Terraform/OpenTofu,
  CloudFormation, Helm, Docker Compose) into equivalent deployments, running a
  customer-side appliance and a digital twin so vendors get continuous updates,
  streamed observability, and zero-trust remote operations while customer data
  never leaves the customer's boundary. The programmatic surface is the tensor9
  CLI / control plane (API-key authenticated); Tensor9 does not publish a public
  REST/OpenAPI API. Backed by Wing Venture Capital. SOC 2 Type II attested.
